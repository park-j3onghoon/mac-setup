<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생키 도식</title>
<style>
  :root {
    --ink: #1f2933; --sub: #52606d; --faint: #8a94a1; --line: #e4e7eb; --bg: #ffffff; --panel: #fafbfc;
    --warn-bg: #fff6e8; --warn-line: #f2c78a; --warn-ink: #8a4b00;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; line-height: 1.55; }
  main { max-width: 1480px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .lead { color: var(--sub); margin: 0 0 14px; font-size: 14.5px; max-width: 90ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; font-size: 13px; }
  .facts li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--panel); }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-size: 13.5px; }
  .warn ul { margin: 4px 0 0; padding-left: 18px; }
  .board { border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px 24px; overflow-x: auto; }
  .inner { width: var(--w); }
  .heads { display: flex; justify-content: space-between; gap: 48px; }
  .heads > div { max-width: 46%; }
  .heads h2 { font-size: 16px; margin: 0 0 2px; }
  .heads p { margin: 0; color: var(--sub); font-size: 12.5px; }
  .heads .right { text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--sub); margin: 14px 0 2px; }
  .legend i { display: inline-block; width: 22px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; opacity: .8; }
  .scale { font-size: 12px; color: var(--faint); text-align: right; margin: 0 0 12px; }
  .stage { position: relative; }
  .stage svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .ncard { position: absolute; width: var(--card-w); border: 1.5px solid var(--c); background: var(--t); border-radius: 8px; padding: 8px 12px 9px; font-size: 12px; color: var(--sub); transition: opacity .12s, box-shadow .12s; }
  .ncard.dashed { border-style: dashed; }
  .ncard .top { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; }
  .ncard .tag { color: var(--ci); }
  .ncard .badge { color: var(--bi); white-space: nowrap; }
  .ncard .name { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .ncard .sub { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .ncard .val { font-size: 13px; font-weight: 700; color: var(--ink); margin: 1px 0; font-variant-numeric: tabular-nums; }
  .ncard .line { font-size: 11.5px; line-height: 1.5; }
  .bar { transition: opacity .12s; }
  .rib { fill-opacity: .5; stroke-opacity: 0; transition: fill-opacity .12s, stroke-opacity .12s; cursor: pointer; }
  .rib.thin { fill: none; stroke-opacity: .6; }
  .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .flabel { cursor: pointer; transition: opacity .12s; }
  .flabel text { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
  .hovering .rib { fill-opacity: .07; stroke-opacity: .08; }
  .hovering .rib.hl { fill-opacity: .9; stroke-opacity: 1; }
  .hovering .flabel { opacity: .18; }
  .hovering .flabel.hl { opacity: 1; }
  .hovering .ncard, .hovering .bar { opacity: .3; }
  .hovering .ncard.hl, .hovering .bar.hl { opacity: 1; }
  .hovering .ncard.hl { box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .notes { color: var(--sub); font-size: 13px; margin: 14px 0 0; padding-left: 18px; }
  .modal { position: fixed; inset: 0; background: rgba(31,41,51,.45); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .modal[hidden] { display: none; }
  .dialog { background: #fff; border-radius: 14px; width: min(1080px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .dialog header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .dialog h2 { margin: 0 0 4px; font-size: 17px; }
  .dialog header p { margin: 0; color: var(--sub); font-size: 13px; }
  .dialog button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .dialog .body { overflow: auto; padding: 0 22px 20px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  thead th { position: sticky; top: 0; background: #f3f5f8; color: var(--sub); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <ul class="facts" id="facts"></ul>
  <div class="warn" id="warn" hidden></div>
  <section class="board">
    <div class="inner" id="inner">
      <div class="heads">
        <div><h2 id="lt"></h2><p id="ld"></p></div>
        <div class="right"><h2 id="rt"></h2><p id="rd"></p></div>
      </div>
      <div class="legend" id="legend"></div>
      <p class="scale" id="scale"></p>
      <div class="stage" id="stage"></div>
    </div>
  </section>
  <ul class="notes" id="notes"></ul>
</main>
<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <header>
      <div><h2 id="mtitle"></h2><p id="msub"></p></div>
      <button type="button" id="mclose">닫기</button>
    </header>
    <div class="body"><table><thead id="mhead"></thead><tbody id="mbody"></tbody></table></div>
  </div>
</div>

<script>
(() => {
  const D = JSON.parse(document.getElementById('diagram-data').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n).toLocaleString('ko-KR');
  const unit = D.unit || '';
  const kinds = D.kinds || {};
  const NAMED = { red: '#c0392b', green: '#2e7d32', amber: '#b7791f', grey: '#6b7785', blue: '#2b6cb0', purple: '#6b46c1', beige: '#9c8f78' };
  const hex = v => (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v || '') ? v : null);
  const colorOf = key => hex(kinds[key] && kinds[key].color) || NAMED[key] || hex(key) || '#8d99a6';
  const rgb = h => { const v = h.replace('#', ''); const x = v.length === 3 ? v.split('').map(c => c + c).join('') : v; return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); };
  const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
  const darken = (h, t = 0.35) => `rgb(${rgb(h).map(c => Math.round(c * (1 - t))).join(',')})`;

  const avail = document.querySelector('.board').clientWidth - 48;
  const W = D.width || Math.max(1100, Math.min(1440, avail)), CARD_W = D.cardWidth || 320, BAR_W = 12, CARD_GAP = 14, NODE_GAP = 18, LABEL_LH = 15, MIN_BAR = 3;
  const MIN_W = D.minWidth || 1.2;
  const LX = CARD_W + CARD_GAP, RX = W - CARD_W - CARD_GAP - BAR_W;
  const warnings = [];

  const nodes = new Map();
  const addSide = (side, list) => (list || []).forEach((n, idx) => nodes.set(n.id, { ...n, side, idx, out: [], in: [], value: 0 }));
  addSide('L', D.left && D.left.nodes);
  addSide('R', D.right && D.right.nodes);
  const flows = (D.flows || []).filter(f => {
    const a = nodes.get(f.from), b = nodes.get(f.to);
    if (!a || !b || a.side !== 'L' || b.side !== 'R') { warnings.push(`흐름 ${f.from} -> ${f.to}: 왼쪽에서 오른쪽으로 가는 노드 쌍이 아니다`); return false; }
    if (!(Number(f.value) > 0)) { warnings.push(`흐름 ${f.from} -> ${f.to}: 값이 0보다 커야 한다`); return false; }
    if (f.kind && !kinds[f.kind]) warnings.push(`흐름 ${f.from} -> ${f.to}: kinds에 없는 kind "${f.kind}"`);
    if (f.items && f.items.length !== Number(f.value)) warnings.push(`흐름 ${f.from} -> ${f.to}: 목록 ${fmt(f.items.length)}행, 값 ${fmt(f.value)}${unit}`);
    return true;
  }).map((f, i) => ({ ...f, value: Number(f.value), i }));
  flows.forEach(f => { nodes.get(f.from).out.push(f); nodes.get(f.to).in.push(f); });
  nodes.forEach(n => {
    n.value = (n.side === 'L' ? n.out : n.in).reduce((s, f) => s + f.value, 0);
    if (n.total != null && Number(n.total) !== n.value) warnings.push(`${n.name}: 원천 합계 ${fmt(n.total)}${unit}, 흐름 합 ${fmt(n.value)}${unit}`);
    if (n.value === 0) warnings.push(`${n.name}: 연결된 흐름이 없다`);
  });
  const total = [...nodes.values()].filter(n => n.side === 'L').reduce((s, n) => s + n.value, 0);

  function niceScale(raw) {
    const cands = [];
    for (let k = -3; k <= 9; k++) for (const m of [1, 2, 5]) cands.push(m * 10 ** k);
    const N = cands.find(n => n * raw >= 4) || 1;
    const px = Math.max(1, Math.round(N * raw));
    return { scale: px / N, N, px };
  }
  let S;
  if (D.scale) { const N = niceScale(D.scale).N; S = { scale: D.scale, N, px: +(N * D.scale).toFixed(1) }; }
  else S = niceScale((D.targetHeight || 900) / Math.max(total, 1));
  const scale = S.scale;

  $('title').textContent = D.title || '';
  document.title = D.title || document.title;
  $('lead').textContent = D.lead || '';
  $('facts').innerHTML = [...(D.facts || []), `전체 ${fmt(total)}${unit}`].map(t => `<li>${esc(t)}</li>`).join('');
  $('lt').textContent = (D.left && D.left.title) || '';
  $('ld').textContent = (D.left && D.left.desc) || '';
  $('rt').textContent = (D.right && D.right.title) || '';
  $('rd').textContent = (D.right && D.right.desc) || '';
  $('legend').innerHTML = Object.values(kinds).map(k => `<span><i style="background:${esc(k.color)}"></i>${esc(k.label)}</span>`).join('');
  $('scale').textContent = `막대 높이와 띠 굵기는 ${unit ? unit + ' ' : ''}수에 비례한다 (${fmt(S.N)}${unit} = ${S.px}px, 아주 작은 묶음은 최소 굵기)`;
  $('notes').innerHTML = (D.notes || []).map(t => `<li>${esc(t)}</li>`).join('');
  const inner = $('inner'), stage = $('stage');
  inner.style.setProperty('--w', W + 'px');
  stage.style.setProperty('--card-w', CARD_W + 'px');

  nodes.forEach(n => {
    const c = colorOf(n.tone);
    const el = document.createElement('div');
    el.className = 'ncard' + (n.dashed ? ' dashed' : '');
    el.dataset.node = n.id;
    el.style.cssText = `--c:${rgba(c, .6)};--t:${rgba(c, .07)};--ci:${darken(c)};--bi:${darken(colorOf(n.badgeTone || n.tone), .15)}`;
    el.innerHTML = `<div class="top"><span class="tag">${esc(n.tag)}</span>${n.badge ? `<span class="badge">${esc(n.badge)}</span>` : ''}</div>`
      + `<div class="name">${esc(n.name)}</div>${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ''}`
      + `<div class="val">${fmt(n.value)}${esc(unit)}</div>${(n.lines || []).map(l => `<div class="line">${esc(l)}</div>`).join('')}`;
    stage.appendChild(el);
    n.el = el;
    n.cardH = el.offsetHeight;
  });

  const heights = {};
  for (const side of ['L', 'R']) {
    let y = 0;
    [...nodes.values()].filter(n => n.side === side).sort((a, b) => a.idx - b.idx).forEach(n => {
      n.barH = Math.max(MIN_BAR, n.value * scale);
      const slot = Math.max(n.barH, n.cardH);
      n.barY = y + (slot - n.barH) / 2;
      n.cardY = y + (slot - n.cardH) / 2;
      y += slot + NODE_GAP;
    });
    heights[side] = y - NODE_GAP;
  }
  nodes.forEach(n => {
    const list = n.side === 'L' ? n.out : n.in;
    list.sort((a, b) => nodes.get(n.side === 'L' ? a.to : a.from).idx - nodes.get(n.side === 'L' ? b.to : b.from).idx);
    let y = n.barY + (n.barH - n.value * scale) / 2;
    for (const f of list) {
      if (n.side === 'L') f.y0 = y; else f.y1 = y;
      y += f.value * scale;
    }
  });

  const x0 = LX + BAR_W, x1 = RX, xm = (x0 + x1) / 2, LABEL_X = x0 + 16;
  const labels = flows.map(f => ({ f, want: f.y0 + f.value * scale / 2 })).sort((a, b) => a.want - b.want);
  let last = -Infinity;
  for (const L of labels) { L.y = Math.max(L.want, last + LABEL_LH); last = L.y; }
  const H = Math.ceil(Math.max(heights.L, heights.R, last + 10));
  stage.style.height = H + 'px';

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(D.title)}">`;
  for (const f of flows) {
    const k = kinds[f.kind] || {}, c = hex(k.color) || '#8d99a6', h = f.value * scale;
    const tip = `${fmt(f.value)}${unit}${f.items ? ' (누르면 목록)' : ''}`;
    if (h >= MIN_W) {
      svg += `<path class="rib" data-flow="${f.i}" d="M${x0},${f.y0} C${xm},${f.y0} ${xm},${f.y1} ${x1},${f.y1} L${x1},${f.y1 + h} C${xm},${f.y1 + h} ${xm},${f.y0 + h} ${x0},${f.y0 + h} Z" fill="${c}" stroke="${c}"><title>${esc(tip)}</title></path>`;
    } else {
      const c0 = f.y0 + h / 2, c1 = f.y1 + h / 2;
      svg += `<path class="rib thin" data-flow="${f.i}" d="M${x0},${c0} C${xm},${c0} ${xm},${c1} ${x1},${c1}" stroke="${c}" stroke-width="${MIN_W}"></path>`;
      svg += `<path class="hit" data-flow="${f.i}" d="M${x0},${c0} C${xm},${c0} ${xm},${c1} ${x1},${c1}"><title>${esc(tip)}</title></path>`;
    }
  }
  nodes.forEach(n => {
    const c = colorOf(n.tone);
    svg += `<rect class="bar" data-node="${esc(n.id)}" x="${n.side === 'L' ? LX : RX}" y="${n.barY}" width="${BAR_W}" height="${n.barH}" rx="2" fill="${darken(c, .1)}"></rect>`;
  });
  for (const L of labels) {
    const f = L.f, k = kinds[f.kind] || {}, c = hex(k.color) || '#8d99a6', to = nodes.get(f.to);
    const text = `${fmt(f.value)}${unit} | ${to.name}${f.label ? ' | ' + f.label : ''}`;
    const style = k.emphasis ? `font-weight="700" fill="${darken(c)}"` : `font-weight="500" fill="#3e4c59"`;
    const lead = Math.abs(L.y - L.want) > 2 ? `<path d="M${x0 + 1},${L.want} L${LABEL_X - 3},${L.y}" stroke="${c}" stroke-width="1.1" fill="none"></path>` : '';
    svg += `<g class="flabel" data-flow="${f.i}">${lead}<text x="${LABEL_X}" y="${L.y + 4}" font-size="${k.emphasis ? 12 : 11.5}" ${style}>${esc(text)}</text></g>`;
  }
  svg += '</svg>';
  stage.insertAdjacentHTML('afterbegin', svg);
  nodes.forEach(n => {
    n.el.style.top = n.cardY + 'px';
    n.el.style.left = (n.side === 'L' ? 0 : RX + BAR_W + CARD_GAP) + 'px';
  });

  if (warnings.length) {
    $('warn').hidden = false;
    $('warn').innerHTML = `<b>데이터 확인 필요</b><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`;
  }

  const clear = () => { stage.classList.remove('hovering'); stage.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); };
  const mark = (flowIds, nodeIds) => {
    clear();
    stage.classList.add('hovering');
    flowIds.forEach(i => stage.querySelectorAll(`[data-flow="${i}"]`).forEach(e => e.classList.add('hl')));
    nodeIds.forEach(id => stage.querySelectorAll(`[data-node="${CSS.escape(id)}"]`).forEach(e => e.classList.add('hl')));
  };
  stage.addEventListener('mouseover', e => {
    const fe = e.target.closest('[data-flow]'), ne = e.target.closest('[data-node]');
    if (fe) { const f = flows[fe.dataset.flow]; mark([f.i], [f.from, f.to]); }
    else if (ne) {
      const n = nodes.get(ne.dataset.node), list = n.side === 'L' ? n.out : n.in;
      mark(list.map(f => f.i), [n.id, ...list.map(f => (n.side === 'L' ? f.to : f.from))]);
    }
  });
  stage.addEventListener('mouseleave', clear);

  const modal = $('modal');
  const close = () => { modal.hidden = true; };
  $('mclose').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  stage.addEventListener('click', e => {
    const fe = e.target.closest('[data-flow]');
    if (!fe) return;
    const f = flows[fe.dataset.flow];
    if (!f.items || !f.items.length) return;
    const cols = [...new Set(f.items.flatMap(r => Object.keys(r)))];
    const isNum = v => typeof v === 'number';
    $('mtitle').textContent = `${nodes.get(f.from).name} -> ${nodes.get(f.to).name}: ${fmt(f.value)}${unit}`;
    $('msub').textContent = [kinds[f.kind] && kinds[f.kind].label, f.label].filter(Boolean).join(' · ');
    $('mhead').innerHTML = `<tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
    $('mbody').innerHTML = f.items.map((r, i) => `<tr><td class="num">${i + 1}</td>${cols.map(c => `<td class="${isNum(r[c]) ? 'num' : ''}">${esc(isNum(r[c]) ? fmt(r[c]) : r[c])}</td>`).join('')}</tr>`).join('');
    modal.hidden = false;
  });
})();
</script>
</body>
</html>
