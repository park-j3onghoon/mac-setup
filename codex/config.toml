model = "gpt-5.4-mini"
model_reasoning_effort = "low"

[features]
codex_hooks = true

# 프로젝트별 trust_level은 사용자 머신 경로에 종속되므로 새 맥에서 필요 시 개별 설정.
# 예: [projects."/Users/{user}/git/{repo}"]
#      trust_level = "trusted"

[tui]
status_line = ["model-name", "model-with-reasoning", "current-dir", "project-root", "git-branch", "context-remaining", "context-used", "five-hour-limit", "weekly-limit"]

[notice]
hide_full_access_warning = true

[notice.model_migrations]
"gpt-5.1-codex-mini" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"

[plugins."github@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."sentry@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp"

[mcp_servers.slack]
url = "https://mcp.slack.com/mcp"
